name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk SwipeClean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-apk
          path: SwipeClean.apk
      - name: Publicar en Releases (enlace directo para el teléfono)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SwipeClean.apk \
            --title "SwipeClean 1.0.${{ github.run_number }}" \
            --notes "APK compilado automáticamente desde ${{ github.sha }}." \
            --latest
